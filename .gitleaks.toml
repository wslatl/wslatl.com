# Settings for the secret scan in .github/workflows/security.yml, which runs
# gitleaks over every commit: gitleaks' own rules, and one more for this
# site's admin password hashes, which no general rule knows the shape of.
#
# The findings reviewed and set aside are in .gitleaksignore, each by its
# commit, file and line. An exception list kept here, for this rule or for
# all, was not applied by this version of gitleaks while its own rules are
# extended (gitleaks issue 1919), so none is kept.

[extend]
useDefault = true

[[rules]]
id = "wslatl-admin-password-hash"
description = "An admin password hash: the ADMIN_PASSWORD_HASH line npm run admin:hash prints, which belongs in .env on the server alone"
regex = '''scrypt:\d+:\d+:\d+:[A-Za-z0-9_-]{16,}:[A-Za-z0-9_-]{32,}'''
keywords = ["scrypt:"]
