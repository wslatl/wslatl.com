name: Start the built site
description: >-
  Starts the build made earlier in the job with next start, in the
  background, and waits until it answers. A server that never comes up fails
  here in a minute, with its log, instead of leaving a later step to hang.
  The log stays in the runner's temporary folder as next.log, for a later
  step to keep.

inputs:
  port:
    description: The port to serve on.
    default: '3100'
  path:
    description: The address that must answer before the site counts as up.
    default: /

runs:
  using: composite
  steps:
    - name: Start next start and wait for it
      shell: bash
      env:
        SITE_PORT: ${{ inputs.port }}
        SITE_PATH: ${{ inputs.path }}
      run: |
        npm run start -- --port "$SITE_PORT" > "$RUNNER_TEMP/next.log" 2>&1 &
        for _ in $(seq 1 60); do
          curl -fsS -o /dev/null "http://localhost:${SITE_PORT}${SITE_PATH}" && exit 0
          sleep 1
        done
        echo "The site did not start." >&2
        cat "$RUNNER_TEMP/next.log" >&2
        exit 1
