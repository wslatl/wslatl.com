name: Workflow lint

# Checks these workflow files whenever anything under .github changes, in two
# jobs: actionlint for whether each is right (syntax, expressions, and the
# shell in each run step, through shellcheck), and zizmor for whether each is
# safe (settings in .github/zizmor.yml). zizmor fails on an action not pinned
# to a full commit, a pin whose version comment is wrong or whose commit is
# not the action's own, a checkout that keeps its token, a cache a release
# could read, a permission no job needs, and the rest of its list.
#
# Both are release binaries, checked against the SHA-256 GitHub recorded for
# each when it was published, as gitleaks is in security.yml. To update one,
# change its version and its SHA-256 together.
on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Lint every workflow
        run: '"$RUNNER_TEMP/actionlint" -color'

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        env:
          VERSION: 1.32.0
          SHA256: bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zizmor.tar.gz" "https://github.com/zizmorcore/zizmor/releases/download/v${VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
      # With the run's own read-only token, for the checks that ask GitHub:
      # that each pinned commit belongs to the action it names, that the
      # version beside it is that commit's, and that no action used has a
      # known advisory.
      - name: Audit every workflow and dependabot.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor" .'
