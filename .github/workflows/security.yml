name: Security

# Three checks, one job each (SECURITY.md has what they guard against):
#
#   - Secrets: gitleaks over every commit there has ever been, on every push
#     and pull request. A password, token or key that was ever committed
#     fails it, even one deleted since. Settings in .gitleaks.toml; the
#     findings reviewed and set aside, one by one, in .gitleaksignore.
#   - Scan: OWASP ZAP's baseline scan of a build made here in the job, run by
#     next start with made-up admin settings like ci.yml's. It fails on any
#     alert of medium risk or worse (.github/zap/gate.mjs), apart from the
#     reviewed exceptions in .github/zap/rules.tsv, each with its reason.
#     Scans only ever run against this build, never a live site.
#   - Live: every Monday, wslatl.com seen from outside, the way any browser
#     sees it: its headers, cookies, HTTPS and TLS (scripts/check-security.mjs).
#     GET requests and TLS handshakes only, nothing more. A failure opens one
#     issue, "Security headers or TLS on wslatl.com", which closes itself
#     once the check passes again, as Broken links does.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secrets in the history
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The release binary, checked against the SHA-256 GitHub recorded for
      # it when it was published: gitleaks' own action needs a paid licence
      # for a repository that belongs to an organisation. Change both lines
      # together.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # --redact: a finding is reported by commit, file, line and rule, never
      # by its value. The logs of a public repository are public.
      - name: Scan every commit
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --no-banner .

  scan:
    name: ZAP baseline scan of a build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Made-up admin settings, as in ci.yml, so the admin's sign-in page is
      # there to be scanned. Nothing can sign in with them: no password makes
      # this hash.
      - name: Made-up admin settings
        run: |
          {
            echo "ADMIN_PASSWORD_HASH=scrypt:32768:8:1:Y2FuYXJ5LXNhbHQtY2FuYXJ5:Y2FuYXJ5LWtleS1jYW5hcnkta2V5LWNhbmFyeS1rZXk"
            echo "ADMIN_SESSION_SECRET=zap-canary-session-secret-${GITHUB_RUN_ID}-0123456789"
            echo "GITHUB_TOKEN=zap-canary-github-token-${GITHUB_RUN_ID}"
          } > .env
      - run: npm run build
      - name: Start the built site
        run: |
          npm run start -- --port 3100 > "$RUNNER_TEMP/next.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3100/ > /dev/null && exit 0
            sleep 1
          done
          echo "The site did not start" >&2
          cat "$RUNNER_TEMP/next.log" >&2
          exit 1
      # ZAP 2.17.0, pinned by digest, since a tag can be moved to other code.
      # To update: the digest of ghcr.io/zaproxy/zaproxy:<version>, and the
      # version here. The hooks file adds the pages nothing links to (the
      # admin, the 404 pages) to what is scanned.
      - name: ZAP baseline scan
        env:
          ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
        run: |
          mkdir -p "$RUNNER_TEMP/zap"
          cp .github/zap/rules.tsv .github/zap/hooks.py "$RUNNER_TEMP/zap/"
          chmod -R a+rwX "$RUNNER_TEMP/zap"
          status=0
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost:3100/ -c rules.tsv --hook=/zap/wrk/hooks.py -m 3 \
            -J report.json -r report.html -w report.md || status=$?
          # 1 and 2 mean alerts, which the next step judges by their risk;
          # anything higher means the scan itself did not run.
          if [ "$status" -gt 2 ]; then
            echo "ZAP did not finish (exit code $status)." >&2
            exit "$status"
          fi
      # Into the log and the job summary both; bash with pipefail, so a
      # failure of the gate is not hidden by tee.
      - name: Fail on a medium risk or worse
        shell: bash
        run: node .github/zap/gate.mjs "$RUNNER_TEMP/zap/report.json" .github/zap/rules.tsv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: |
            ${{ runner.temp }}/zap/report.html
            ${{ runner.temp }}/zap/report.json
            ${{ runner.temp }}/zap/report.md
            ${{ runner.temp }}/next.log
          retention-days: 14

  live:
    name: Headers and TLS of wslatl.com
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check the live site
        id: check
        run: |
          status=0
          node scripts/check-security.mjs https://wslatl.com > "$RUNNER_TEMP/security.md" || status=$?
          cat "$RUNNER_TEMP/security.md" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then failing=true; else failing=false; fi
          echo "failing=$failing" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/tracking-issue
        with:
          title: Security headers or TLS on wslatl.com
          label: security-check
          report: ${{ runner.temp }}/security.md
          failing: ${{ steps.check.outputs.failing }}
      - name: Fail when a check failed
        if: steps.check.outputs.failing == 'true'
        run: exit 1
