name: Security audit

# Daily, and whenever the dependencies change: fails on a known
# vulnerability, or on a package whose registry signature does not check out.
on:
  push:
    branches: [main]
    paths: [package.json, package-lock.json]
  pull_request:
    paths: [package.json, package-lock.json]
  schedule:
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Registry signatures and provenance
        run: npm audit signatures
      # The site's own dependencies run on the server, so any advisory counts.
      - name: Vulnerabilities in what the site runs
        run: npm audit --omit=dev --audit-level=moderate
      # Build tools never reach visitors; fail on the serious ones.
      - name: Vulnerabilities in the build tools
        run: npm audit --audit-level=high
