name: Accessibility

# axe (scripts/check-a11y.mjs) in a real Chrome, on a build made here: one
# page of every kind in all five languages, the 404 page in each language,
# and the admin's sign-in page, each at a phone's width and a desktop's. Every
# WCAG 2.2 A and AA rule axe has, and its best practices. Lighthouse holds
# seven English pages to 100 on the part of these rules it scores; this adds
# the translations, whose words and labels differ, and the admin. Any
# violation fails the pull request, and the report is in the job summary.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/**', 'tests/**']
  pull_request:
    paths-ignore: ['**.md', 'tests/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: axe on every kind of page, in five languages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Made-up admin settings, so the admin is switched on and its sign-in
      # page is there to be checked. Nobody can sign in with them.
      - uses: ./.github/actions/made-up-admin
        with:
          job: axe
      - run: npm run build
      - uses: ./.github/actions/start-site
        with:
          port: '3100'
      # The runner's own Chrome, through Playwright's library: no browser is
      # downloaded.
      - name: Check every kind of page
        run: |
          status=0
          node scripts/check-a11y.mjs http://localhost:3100 > "$RUNNER_TEMP/a11y.md" || status=$?
          cat "$RUNNER_TEMP/a11y.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/a11y.md"
          exit "$status"
