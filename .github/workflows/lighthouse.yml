name: Lighthouse

# Builds the site and audits key pages (settings in lighthouserc.json).
# Accessibility, best practices, and SEO must stay at 100, and page weight
# and layout shift have budgets. The full reports are kept as an artifact.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/**', 'tests/**']
  pull_request:
    paths-ignore: ['**.md', 'tests/**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      # Started here rather than by Lighthouse itself, so a server that never
      # comes up fails in seconds instead of hanging the run.
      - uses: ./.github/actions/start-site
        with:
          port: '3100'
      - name: Audit key pages
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14
