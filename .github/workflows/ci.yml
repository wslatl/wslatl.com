name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Made-up admin settings, so the scan below can prove that no .env
      # value reaches what the site serves. Nothing here starts the admin.
      - name: Canary admin settings
        run: |
          {
            echo "ADMIN_PASSWORD_HASH=scrypt:32768:8:1:Y2FuYXJ5LXNhbHQtY2FuYXJ5:Y2FuYXJ5LWtleS1jYW5hcnkta2V5LWNhbmFyeS1rZXk"
            echo "ADMIN_SESSION_SECRET=ci-canary-session-secret-${GITHUB_RUN_ID}-0123456789"
            echo "GITHUB_TOKEN=ci-canary-github-token-${GITHUB_RUN_ID}"
          } > .env
      # The build generates the route types next-env.d.ts points at, so the
      # standalone typecheck runs after it.
      - run: npm run build
      - name: No email address, admin secret or dynamic page in what the site serves
        run: npm run scan:build
      # The attack tests against the build itself, run by next start with
      # settings of their own (tests/http): headers, the session, redirects,
      # and nothing secret in any answer or in the server's log.
      - name: Attack tests against the build
        run: npm run test:http
      - run: npm run typecheck
