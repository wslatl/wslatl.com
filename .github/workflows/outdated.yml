name: Outdated packages

# Every Monday: lists packages with newer versions and keeps one issue,
# "Outdated packages", up to date with that list. The issue closes itself
# once everything is current. Dependabot opens the pull requests.
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: outdated
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # its one tracking issue (.github/actions/tracking-issue)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the report
        id: report
        run: |
          node scripts/outdated-report.mjs > "$RUNNER_TEMP/outdated.md"
          cat "$RUNNER_TEMP/outdated.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/tracking-issue
        with:
          title: Outdated packages
          label: dependencies
          report: ${{ runner.temp }}/outdated.md
          failing: ${{ steps.report.outputs.needs-attention }}
