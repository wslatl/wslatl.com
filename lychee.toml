# Settings for the weekly link check (.github/workflows/links.yml), which
# opens every page in the live sitemap and follows every link on it.

# Be patient with slow hosts before calling a link broken.
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 8

# 429 means a host rate-limited us, not that the page is gone.
accept = ["200..=299", "429"]

# Addresses are not in the HTML at all (see "Email addresses" in README.md).
include_mail = false

# Nothing on this site should point at a private address.
exclude_all_private = true

exclude = [
  # Trustpilot answers 403 to anything that is not a browser. The profile
  # itself is fine; open wslatl.com/trustpilot to check it by hand.
  '^https://www\.trustpilot\.com/',
  # Cloudflare rewrites any mailto link it sees into one of these, and they
  # only resolve in a browser. Pages built since September 2026 carry no
  # mailto link at all, so these disappear as the site is deployed.
  '/cdn-cgi/l/email-protection',
]
